# Upstream tracker data. One entry per change we want, keyed by series name
# where a patch series exists, or by a short slug for watch-only items.
# `scripts/tracker.py` joins this with patches/series (for `needs`) and live
# GitHub state to produce the tracker page. Only upstream links live here.
#
# Fields (all optional except want):
#   want          one line: what we want
#   issue         upstream issue we filed or that tracks this
#   our_pr        our open PR
#   carries       someone else's PR this series is a copy of; drop when it merges
#   superseded_by issue/PR of someone else's work that makes ours redundant
#   blocked_by    issue/PR that has to move before we can proceed
#   related       issues/PRs worth watching alongside (converges on, conflicts with)
#   conflicts     PRs touching the same code; whichever lands second rebases
#   keep_local    true when we have decided this never goes upstream
#   note          one short sentence shown on the row
#   drafts        repo-relative paths of unposted comment/issue text

series:
  claude-config-dir:
    want: claude-native and claude-sdk follow CLAUDE_CONFIG_DIR instead of assuming ~/.claude.
    carries: 9617
    related:
    - 7124
  subscription-accounts:
    want: Several subscription logins per host; pick, switch and share accounts per session.
    issue: 503
    blocked_by: 503
    note: Waits on a design reply;
    related:
    - 583
    drafts:
    - proposals/subscription-accounts/comment-503.md
  toast-safe-area:
    want: Toasts stay below the iOS status bar and Dynamic Island.
    note: Reviewed, captures done; commit message needs the Android wording fix.
  session-history-paging:
    want: Agents can page a session's history and list recent sessions.
    related:
    - 4601
    - 11109
    - 11299
    note: 'Sweep rank 2: additive, precedent #4601 merged; split into list-filters and history-cursor
      PRs; #11109 and #11299 touch the same read path.'
  terminal-touch:
    want: Termux-style extra keys, long-press select/copy/paste, native paste on touch.
    carries: 6136
    note: Only the extra-keys row is carried; the two iOS fixes should be proposed on
  telemetry-attribution:
    want: Exported spans carry the acting user (opt-in), runner and host.
    issue: 10794
    note: Review found host.id missing and an unproposed env var; fix or descope first.
  sidebar-attention-filter:
    want: Sidebar filters for sessions that need you or changed recently.
    related:
    - 9232
    - 9792
    - 10433
    note: 'Sweep: weak fit; duplicates the flagged sidebar_grouping_ui "Needs attention" bucket (#9792,
      #10433) and the Inbox tabs (#9232 merged). Suggested: keep local.'
  claude-sdk-web-tools:
    want: claude-sdk agents can opt into Claude Code's WebSearch and WebFetch.
    related:
    - 5829
    - 6529
    - 8584
    note: 'Sweep: opt-in and policy-gated, but a harness-specific spec field; #6529 (bot) gates WebSearch
      for claude-native; #8584 is the spec tool-group precedent. Feature issue first.'
  run-suggested-commands:
    want: A Run button on shell commands an agent suggests in chat.
    superseded_by: 10857
    related:
    - 10519
    - 7838
    - 7840
    keep_local: true
    note: The
