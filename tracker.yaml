# Upstream tracker data. One entry per change we want, keyed by series name
# where a patch series exists, or by a short slug for watch-only items.
# `scripts/tracker.py` joins this with patches/series (for `needs`) and live
# GitHub state to produce the tracker page. Only upstream links live here.
#
# Fields (all optional except want):
#   want          one line: what we want
#   issue         upstream issue we filed or that tracks this
#   our_pr        our open PR
#   carries       someone else's PR this series is a copy of; drop when it merges
#   superseded_by issue/PR of someone else's work that makes ours redundant
#   blocked_by    issue/PR that has to move before we can proceed
#   related       issues/PRs worth watching alongside (converges on, conflicts with)
#   conflicts     PRs touching the same code; whichever lands second rebases
#   keep_local    true when we have decided this never goes upstream
#   note          one short sentence shown on the row
#   drafts        repo-relative paths of unposted comment/issue text

series:
  claude-config-dir:
    want: claude-native and claude-sdk follow CLAUDE_CONFIG_DIR instead of assuming ~/.claude.
    carries: 9617
    related:
    - 7124
  subscription-accounts:
